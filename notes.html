<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Study Notes | StudyMate AI</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        .notes-page {
            min-height: 100vh;
            padding: 60px 8%;
        }

        .notes-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 40px;
        }

        .notes-header h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        .notes-header p {
            color: #64748b;
        }

        .back-btn {
            text-decoration: none;
            background: #6366f1;
            color: white;
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: 600;
        }

        .notes-container {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 30px;
        }

        .note-form,
        .notes-list {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 18px;
            padding: 25px;
        }

        .note-form h2,
        .notes-list h2 {
            margin-bottom: 20px;
        }

        .note-form input,
        .note-form select,
        .note-form textarea,
        .search-box {
            width: 100%;
            padding: 13px;
            margin-bottom: 15px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-family: inherit;
            font-size: 14px;
        }

        .note-form textarea {
            height: 180px;
            resize: vertical;
        }

        .save-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 10px;
            background: #6366f1;
            color: white;
            font-weight: 700;
            cursor: pointer;
        }

        .save-btn:hover {
            background: #4f46e5;
        }

        .notes-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .note-card {
            border: 1px solid #e2e8f0;
            border-radius: 15px;
            padding: 20px;
        }

        .note-subject {
            display: inline-block;
            background: #eef2ff;
            color: #4f46e5;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .note-card h3 {
            margin-bottom: 10px;
        }

        .note-card p {
            color: #64748b;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .delete-btn {
            margin-top: 15px;
            padding: 8px 13px;
            border: none;
            border-radius: 8px;
            background: #fee2e2;
            color: #dc2626;
            cursor: pointer;
            font-weight: 600;
        }

        .empty-message {
            color: #64748b;
            text-align: center;
            padding: 40px 10px;
        }

        @media (max-width: 800px) {
            .notes-container {
                grid-template-columns: 1fr;
            }

            .notes-grid {
                grid-template-columns: 1fr;
            }

            .notes-header {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">

        <div class="logo">
            <span>🎓</span>
            StudyMate <strong>AI</strong>
        </div>

        <a href="index.html" class="back-btn">
            ← Dashboard
        </a>

    </nav>


    <main class="notes-page">

        <div class="notes-header">

            <div>
                <h1>📚 Study Notes</h1>

                <p>
                    Create, organize and save your study notes.
                </p>
            </div>

        </div>


        <div class="notes-container">

            <!-- Add Note -->

            <div class="note-form">

                <h2>Add New Note</h2>

                <input
                    type="text"
                    id="noteTitle"
                    placeholder="Note title"
                >

                <select id="noteSubject">

                    <option value="">Select Subject</option>

                    <option value="ADSA">ADSA</option>
                    <option value="DBMS">DBMS</option>
                    <option value="Java">Java</option>
                    <option value="Python">Python</option>
                    <option value="Web Development">Web Development</option>
                    <option value="Other">Other</option>

                </select>

                <textarea
                    id="noteContent"
                    placeholder="Write your note here..."
                ></textarea>

                <button
                    class="save-btn"
                    onclick="saveNote()"
                >
                    💾 Save Note
                </button>

            </div>


            <!-- Notes -->

            <div class="notes-list">

                <h2>My Notes</h2>

                <input
                    type="text"
                    class="search-box"
                    id="searchNotes"
                    placeholder="🔍 Search notes..."
                    oninput="displayNotes()"
                >

                <div
                    class="notes-grid"
                    id="notesGrid"
                ></div>

            </div>

        </div>

    </main>


    <script>

        let notes = JSON.parse(
            localStorage.getItem("studyMateNotes")
        ) || [];


        function saveNote() {

            const title =
                document.getElementById("noteTitle").value.trim();

            const subject =
                document.getElementById("noteSubject").value;

            const content =
                document.getElementById("noteContent").value.trim();


            if (!title || !subject || !content) {

                alert("Please fill all fields.");

                return;
            }


            const note = {

                id: Date.now(),

                title: title,

                subject: subject,

                content: content

            };


            notes.push(note);


            localStorage.setItem(
                "studyMateNotes",
                JSON.stringify(notes)
            );


            document.getElementById("noteTitle").value = "";

            document.getElementById("noteSubject").value = "";

            document.getElementById("noteContent").value = "";


            displayNotes();

            alert("Note saved successfully! ✅");
        }


        function deleteNote(id) {

            notes = notes.filter(
                note => note.id !== id
            );


            localStorage.setItem(
                "studyMateNotes",
                JSON.stringify(notes)
            );


            displayNotes();
        }


        function displayNotes() {

            const grid =
                document.getElementById("notesGrid");

            const search =
                document.getElementById("searchNotes")
                    .value
                    .toLowerCase();


            const filteredNotes =
                notes.filter(note =>
                    note.title.toLowerCase().includes(search) ||
                    note.subject.toLowerCase().includes(search) ||
                    note.content.toLowerCase().includes(search)
                );


            if (filteredNotes.length === 0) {

                grid.innerHTML = `
                    <div class="empty-message">
                        📝 No notes found.<br><br>
                        Create your first study note!
                    </div>
                `;

                return;
            }


            grid.innerHTML = filteredNotes.map(note => `

                <div class="note-card">

                    <span class="note-subject">
                        ${note.subject}
                    </span>

                    <h3>
                        ${note.title}
                    </h3>

                    <p>
                        ${note.content}
                    </p>

                    <button
                        class="delete-btn"
                        onclick="deleteNote(${note.id})"
                    >
                        🗑 Delete
                    </button>

                </div>

            `).join("");
        }


        displayNotes();

    </script>

</body>
</html>
