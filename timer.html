<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Study Timer | StudyMate AI</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f7fb;
            color: #111827;
        }

        .navbar {
            height: 82px;
            background: white;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 8%;
        }

        .logo {
            font-size: 30px;
            font-weight: 800;
        }

        .logo span {
            color: #6366f1;
        }

        .dashboard-btn {
            background: #6366f1;
            color: white;
            border: none;
            padding: 15px 28px;
            border-radius: 15px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .container {
            max-width: 1000px;
            margin: 50px auto;
            padding: 20px;
            text-align: center;
        }

        .title {
            font-size: 60px;
            margin-bottom: 12px;
        }

        .title span {
            color: #6366f1;
        }

        .subtitle {
            color: #64748b;
            font-size: 22px;
            margin-bottom: 40px;
        }

        .timer-card {
            background: white;
            border-radius: 30px;
            padding: 55px 30px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.08);
        }

        .mode {
            font-size: 25px;
            color: #6366f1;
            font-weight: bold;
            margin-bottom: 20px;
        }

        #display {
            font-size: 110px;
            font-weight: 800;
            margin: 20px 0 35px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 18px;
            flex-wrap: wrap;
        }

        button {
            border: none;
            cursor: pointer;
            border-radius: 14px;
            padding: 17px 30px;
            font-size: 18px;
            font-weight: bold;
        }

        .start {
            background: #6366f1;
            color: white;
        }

        .pause {
            background: #f59e0b;
            color: white;
        }

        .reset {
            background: #ef4444;
            color: white;
        }

        .custom-box {
            margin-top: 35px;
            padding: 25px;
            border-top: 1px solid #e5e7eb;
        }

        .custom-box h3 {
            margin-bottom: 15px;
        }

        input {
            width: 180px;
            padding: 14px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 17px;
            margin-right: 10px;
        }

        .set-btn {
            background: #111827;
            color: white;
        }

        .preset {
            margin-top: 25px;
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .preset button {
            background: white;
            border: 1px solid #cbd5e1;
            color: #111827;
        }

        .info {
            margin-top: 30px;
            color: #64748b;
            font-size: 18px;
        }

        @media(max-width:700px) {
            .title {
                font-size: 40px;
            }

            #display {
                font-size: 70px;
            }

            .navbar {
                padding: 0 20px;
            }

            .logo {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>

<header class="navbar">

    <div class="logo">
        🎓 StudyMate <span>AI</span>
    </div>

    <button class="dashboard-btn"
            onclick="location.href='dashboard.html'">
        ← Dashboard
    </button>

</header>


<div class="container">

    <h1 class="title">
        ⏱️ Study <span>Timer</span>
    </h1>

    <p class="subtitle">
        Focus on your studies with the Pomodoro technique.
    </p>


    <div class="timer-card">

        <div class="mode" id="mode">
            📚 Study Time
        </div>

        <div id="display">
            25:00
        </div>


        <div class="buttons">

            <button class="start" onclick="startTimer()">
                ▶ Start
            </button>

            <button class="pause" onclick="pauseTimer()">
                ⏸ Pause
            </button>

            <button class="reset" onclick="resetTimer()">
                🔄 Reset
            </button>

        </div>


        <div class="custom-box">

            <h3>Set Custom Study Time</h3>

            <input
                type="number"
                id="customMinutes"
                placeholder="Minutes"
                min="1"
                max="180"
            >

            <button class="set-btn" onclick="setCustomTime()">
                Set Time
            </button>

        </div>


        <div class="preset">

            <button onclick="setTimer(25)">
                📚 25 Min Study
            </button>

            <button onclick="setTimer(45)">
                📚 45 Min Study
            </button>

            <button onclick="setTimer(60)">
                📚 60 Min Study
            </button>

            <button onclick="setBreak()">
                ☕ 5 Min Break
            </button>

        </div>


        <div class="info">
            💡 Study with focus and take regular breaks.
        </div>

    </div>

</div>


<script>

let totalSeconds = 25 * 60;
let timer = null;
let running = false;

const display = document.getElementById("display");
const mode = document.getElementById("mode");


function updateDisplay() {

    let minutes = Math.floor(totalSeconds / 60);
    let seconds = totalSeconds % 60;

    minutes = String(minutes).padStart(2, "0");
    seconds = String(seconds).padStart(2, "0");

    display.textContent = `${minutes}:${seconds}`;
}


function startTimer() {

    if (running) return;

    running = true;

    timer = setInterval(() => {

        if (totalSeconds > 0) {

            totalSeconds--;

            updateDisplay();

        } else {

            clearInterval(timer);

            running = false;

            alert("⏰ Time is over!");

            mode.textContent = "🎉 Time Complete";

            localStorage.setItem(
                "studySessions",
                Number(localStorage.getItem("studySessions") || 0) + 1
            );
        }

    }, 1000);
}


function pauseTimer() {

    clearInterval(timer);

    running = false;
}


function resetTimer() {

    clearInterval(timer);

    running = false;

    totalSeconds = 25 * 60;

    mode.textContent = "📚 Study Time";

    updateDisplay();
}


function setTimer(minutes) {

    clearInterval(timer);

    running = false;

    totalSeconds = minutes * 60;

    mode.textContent = "📚 Study Time";

    updateDisplay();
}


function setBreak() {

    clearInterval(timer);

    running = false;

    totalSeconds = 5 * 60;

    mode.textContent = "☕ Break Time";

    updateDisplay();
}


function setCustomTime() {

    const value =
        parseInt(document.getElementById("customMinutes").value);

    if (!value || value < 1) {

        alert("Please enter a valid number of minutes.");

        return;
    }

    if (value > 180) {

        alert("Maximum 180 minutes allowed.");

        return;
    }

    setTimer(value);

    mode.textContent = "⏱️ Custom Study Time";
}


updateDisplay();

</script>

</body>
</html>
